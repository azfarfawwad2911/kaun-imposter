:root{
  --bg:#0b0614;--bg2:#160b26;--ink:#fbf6ff;--muted:#bfb0d4;--dim:#8a7aa3;
  --line:#ffffff1f;--glass:#ffffff0d;--glass2:#ffffff17;
  --red:#ff2e63;--red2:#c3123f;--violet:#8b5cf6;--violet2:#5b21b6;--gold:#ffc65c;--green:#34d399;--blue:#60a5fa;
  --accent:var(--red);--accent2:var(--violet);
  --radius:22px;--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1);
  --font:'DM Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;--display:Outfit,system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
body.theme-mafia{--accent:#ff3b3b;--accent2:#3b82f6}
body.night{--accent:#7c9cff;--accent2:#312e81}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);overflow-x:hidden;-webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
input{-webkit-user-select:text;user-select:text}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* ---------- animated background ---------- */
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.blobs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;filter:blur(60px);opacity:.75;transition:opacity 1s}
.blobs i{position:absolute;width:62vmax;height:62vmax;border-radius:50%;opacity:.42;mix-blend-mode:screen;transition:background 1.4s}
.blobs i:nth-child(1){background:radial-gradient(circle,var(--accent) 0,transparent 62%);top:-30vmax;left:-20vmax;animation:drift1 22s ease-in-out infinite alternate}
.blobs i:nth-child(2){background:radial-gradient(circle,var(--accent2) 0,transparent 62%);bottom:-34vmax;right:-24vmax;animation:drift2 26s ease-in-out infinite alternate}
.blobs i:nth-child(3){background:radial-gradient(circle,#4c1d95 0,transparent 60%);top:30%;left:30%;width:45vmax;height:45vmax;animation:drift3 30s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(18vmax,22vmax) scale(1.15)}}
@keyframes drift2{to{transform:translate(-20vmax,-16vmax) scale(1.1)}}
@keyframes drift3{to{transform:translate(-14vmax,10vmax) scale(.85)}}
body.night .blobs{opacity:.45}

/* ---------- stage & page transitions ---------- */
#stage{position:relative;z-index:1;min-height:100dvh}
.page{width:min(100%,540px);min-height:100dvh;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 20px calc(env(safe-area-inset-bottom) + 24px);display:flex;flex-direction:column}
.page.enter{animation:pageIn .5s var(--ease) both}
.page.exit{position:absolute;left:0;right:0;top:0;animation:pageOut .32s var(--ease) both;pointer-events:none}
.page.back.enter{animation-name:pageInBack}
.page.back.exit{animation-name:pageOutBack}
@keyframes pageIn{from{opacity:0;transform:translateX(40px) scale(.98)}to{opacity:1;transform:none}}
@keyframes pageOut{to{opacity:0;transform:translateX(-40px) scale(.98)}}
@keyframes pageInBack{from{opacity:0;transform:translateX(-40px) scale(.98)}to{opacity:1;transform:none}}
@keyframes pageOutBack{to{opacity:0;transform:translateX(40px) scale(.98)}}
.page.fade.enter{animation:fadeIn .7s var(--ease) both}
.page.fade.exit{animation:fadeOut .5s var(--ease) both}
@keyframes fadeIn{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
@keyframes fadeOut{to{opacity:0;transform:scale(.96)}}
/* stagger children */
.st>*{animation:rise .55s var(--ease) both}
.st>*:nth-child(1){animation-delay:.04s}.st>*:nth-child(2){animation-delay:.09s}.st>*:nth-child(3){animation-delay:.14s}.st>*:nth-child(4){animation-delay:.19s}.st>*:nth-child(5){animation-delay:.24s}.st>*:nth-child(6){animation-delay:.29s}.st>*:nth-child(7){animation-delay:.34s}.st>*:nth-child(8){animation-delay:.39s}.st>*:nth-child(n+9){animation-delay:.44s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;margin-bottom:6px}
.top .ttl{font:800 12px/1 var(--font);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);text-align:center;flex:1}
.ibtn{width:46px;height:46px;border-radius:15px;background:var(--glass);border:1px solid var(--line);display:grid;place-items:center;transition:transform .15s var(--spring),background .2s;flex:none}
.ibtn:active{transform:scale(.9)}
.ibtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ibtn.off{opacity:.5}

/* ---------- typography ---------- */
.h1{font:900 clamp(40px,11vw,60px)/.95 var(--display);letter-spacing:-.045em;margin:0}
.h2{font:800 30px/1.05 var(--display);letter-spacing:-.03em;margin:10px 0 6px}
.lead{color:var(--muted);line-height:1.5;margin:0 0 14px}
.label{display:block;text-transform:uppercase;letter-spacing:.16em;font-size:11.5px;font-weight:800;color:var(--accent);margin:20px 0 10px;filter:brightness(1.25)}
.hint{color:var(--dim);text-align:center;font-size:14px;margin:10px 0}
.grow{flex:1;min-height:24px}
.center{text-align:center}

/* ---------- buttons ---------- */
.btn{position:relative;overflow:hidden;width:100%;min-height:58px;border-radius:18px;padding:14px 18px;margin:6px 0;font-weight:800;font-size:16px;letter-spacing:.04em;background:var(--glass2);border:1px solid var(--line);transition:transform .16s var(--spring),box-shadow .25s,filter .2s;display:flex;align-items:center;justify-content:center;gap:10px}
.btn:not(:disabled):active{transform:scale(.97)}
.btn.primary{background:linear-gradient(115deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#5b0a2a));border-color:#ffffff38;box-shadow:0 12px 30px color-mix(in srgb,var(--accent) 40%,transparent)}
.btn.primary::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,#ffffff40 50%,transparent 70%);transform:translateX(-120%);animation:shine 3.4s ease-in-out infinite}
@keyframes shine{0%,60%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.btn.ghost{background:transparent}
.btn.small{min-height:46px;font-size:14px}
.btn.danger{background:linear-gradient(115deg,#ef4444,#991b1b)}
.ripple{position:absolute;border-radius:50%;background:#ffffff55;transform:scale(0);animation:ripple .6s ease-out forwards;pointer-events:none}
@keyframes ripple{to{transform:scale(4);opacity:0}}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row .btn{margin:0}

/* ---------- panels / chips ---------- */
.panel{background:linear-gradient(140deg,#ffffff12,#ffffff06);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin:12px 0;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.panel.hot{background:linear-gradient(140deg,color-mix(in srgb,var(--accent) 55%,transparent),color-mix(in srgb,var(--accent2) 35%,transparent));border-color:#ffffff38}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--glass);border-radius:999px;padding:10px 15px;font-size:14px;font-weight:700;color:var(--muted);transition:all .2s var(--ease)}
.chip.sel{background:var(--accent);border-color:transparent;color:#fff;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 45%,transparent);transform:translateY(-1px)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{border:1px solid var(--line);background:var(--glass);border-radius:18px;padding:14px;text-align:left;transition:all .25s var(--ease);min-height:84px}
.mode b{display:block;font:800 16px var(--display);margin-bottom:4px}
.mode span{font-size:12.5px;color:var(--muted);line-height:1.35}
.mode.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 22%,transparent);box-shadow:inset 0 0 0 1px var(--accent)}

/* ---------- inputs ---------- */
.field{width:100%;min-height:52px;border-radius:15px;background:#0006;border:1px solid var(--line);padding:12px 15px;outline:none;font-size:16px;transition:border .2s,box-shadow .2s}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.names{display:grid;gap:8px}
.name-row{display:flex;align-items:center;gap:10px;animation:rise .35s var(--ease) both}
.num{width:34px;height:34px;flex:none;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--glass2);color:var(--muted)}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:8px 8px 8px 16px;margin:6px 0}
.stepper b{font-size:15px}
.stepper small{display:block;color:var(--dim);font-size:12px;font-weight:500}
.stepper .ctl{display:flex;align-items:center;gap:6px}
.stepper .ctl span{min-width:30px;text-align:center;font:800 20px var(--display)}
.stepper .ibtn{width:40px;height:40px;border-radius:12px;font-size:22px;font-weight:700}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}
.toggle b{font-size:15px}.toggle small{display:block;color:var(--dim);font-size:12.5px;margin-top:2px}
.sw{width:54px;height:32px;border-radius:99px;background:#ffffff22;position:relative;flex:none;transition:background .25s}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .3s var(--spring);box-shadow:0 2px 6px #0006}
.sw.on{background:var(--accent)}.sw.on::after{transform:translateX(22px)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#0005;border-radius:14px;padding:4px;gap:4px}
.seg button{padding:11px;border-radius:11px;font-weight:800;font-size:14px;color:var(--muted);transition:all .25s}
.seg button.sel{background:var(--accent);color:#fff}

/* ---------- splash ---------- */
.splash{position:fixed;inset:0;z-index:50;background:#06030c;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s var(--ease),transform .9s var(--ease)}
.splash.out{opacity:0;transform:scale(1.15);pointer-events:none}
.splash.gone{display:none}
.splash-glow{position:absolute;width:520px;height:520px;max-width:120vw;max-height:120vw;border-radius:50%;background:radial-gradient(circle,#a855f755 0,#ff2e6322 35%,transparent 65%);animation:glow 2.6s ease-out both}
@keyframes glow{from{transform:scale(.2);opacity:0}60%{opacity:1}to{transform:scale(1)}}
.splash-ring{position:absolute;width:150px;height:150px;border-radius:50%;border:2px solid #ffffff55;animation:ring 1.6s .5s ease-out both}
@keyframes ring{from{transform:scale(.5);opacity:1}to{transform:scale(4);opacity:0}}
.splash-mark{width:118px;height:118px;filter:drop-shadow(0 0 22px #a855f7aa);animation:markIn 1s var(--spring) both}
@keyframes markIn{from{transform:scale(.3) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
.mark-hex{stroke-dasharray:340;stroke-dashoffset:340;animation:draw 1.1s .15s ease-out forwards}
.mark-a{stroke-dasharray:160;stroke-dashoffset:160;animation:draw .8s .7s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.splash-name{margin-top:26px;font:900 clamp(46px,14vw,78px)/1 var(--display);letter-spacing:.14em;display:flex;padding-left:.14em}
.splash-name span{display:inline-block;opacity:0;transform:translateY(40px) scale(.6);filter:blur(10px);animation:letter .7s var(--spring) forwards;background:linear-gradient(180deg,#fff 20%,#e9d5ff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 30px #a855f766}
@keyframes letter{to{opacity:1;transform:none;filter:none}}
.splash-line{width:0;height:2px;margin:18px 0 14px;background:linear-gradient(90deg,transparent,#ff2e63,#a855f7,transparent);animation:line .9s 1.5s var(--ease) forwards}
@keyframes line{to{width:min(260px,70vw)}}
.splash-by{font-weight:800;font-size:12.5px;letter-spacing:.42em;color:#d8c8f0;opacity:0;animation:by .8s 1.8s ease forwards;padding-left:.42em}
@keyframes by{from{opacity:0;letter-spacing:.9em}to{opacity:1;letter-spacing:.42em}}
.splash-skip{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 26px);font-size:12px;color:#ffffff44;letter-spacing:.1em;opacity:0;animation:by .6s 1s forwards}

/* ---------- menu ---------- */
.menu-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.brandmini{display:flex;align-items:center;gap:8px;font-weight:800;font-size:12px;letter-spacing:.22em;color:var(--muted)}
.brandmini svg{width:26px;height:26px}
.hero{text-align:center;margin:14px 0 22px}
.hero .h1 span{background:linear-gradient(100deg,var(--red),#c084fc);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);margin:10px 0 0}
.gamecard{position:relative;display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:16px;border-radius:26px;margin:9px 0;border:1px solid #ffffff2a;overflow:hidden;transition:transform .3s var(--spring),box-shadow .3s;isolation:isolate;min-height:128px}
.gamecard::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.9}
.gamecard.imp::before{background:linear-gradient(125deg,#e11d48 0,#7e22ce 75%,#3b0764)}
.gamecard.maf::before{background:linear-gradient(125deg,#1e3a8a 0,#0f172a 60%,#7f1d1d)}
.gamecard::after{content:"";position:absolute;inset:-50%;z-index:-1;background:conic-gradient(from 0deg,transparent 0 70%,#ffffff30 80%,transparent 90%);animation:spin 6s linear infinite}
.gamecard.maf::after{animation-duration:8s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(1turn)}}
.gamecard:active{transform:scale(.97)}
@media(hover:hover){.gamecard:hover{transform:translateY(-4px) scale(1.01);box-shadow:0 18px 40px #0008}}
.gamecard .art{width:96px;height:96px;flex:none;border-radius:22px;overflow:hidden;box-shadow:0 10px 30px #0007;background:#0004;display:grid;place-items:center;animation:bob 4s ease-in-out infinite}
.gamecard.maf .art{animation-delay:-2s}
@keyframes bob{50%{transform:translateY(-5px) rotate(-2deg)}}
.gamecard .art img,.gamecard .art svg{width:100%;height:100%;display:block}
.gamecard>div:not(.art){padding-right:30px}
.gamecard h3{margin:0;font:900 25px/1 var(--display);letter-spacing:-.02em}
.gamecard p{margin:6px 0 10px;font-size:13.5px;color:#ffffffcc;line-height:1.35}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.12em;padding:5px 9px;border-radius:99px;background:#0004;margin-right:4px}
.gamecard .go{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:50%;background:#ffffff26;display:grid;place-items:center;font-size:18px;transition:transform .3s var(--spring)}
.gamecard:hover .go{transform:translateX(4px)}
.menu-foot{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.credit{text-align:center;font-size:12px;letter-spacing:.2em;color:var(--dim);margin-top:18px;font-weight:700}
.credit b{color:var(--muted)}

/* ---------- game hub (imposter) ---------- */
.hub-hero{display:flex;flex-direction:column;align-items:center;text-align:center;margin:8px 0 18px}
.hub-hero img{width:120px;height:120px;border-radius:30px;box-shadow:0 20px 60px #0009,0 0 0 1px #ffffff2a;animation:float 4.5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.hub-hero .h1{margin-top:18px}
.hub-hero .h1 span{color:var(--red)}
.optbtn{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border-radius:20px;background:var(--glass);border:1px solid var(--line);margin:7px 0;text-align:left;transition:transform .2s var(--spring),background .2s,border-color .2s}
.optbtn:active{transform:scale(.97)}
@media(hover:hover){.optbtn:hover{background:var(--glass2);border-color:#ffffff40;transform:translateX(4px)}}
.optbtn .ico{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;font-size:24px;flex:none;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 20px #0005}
.optbtn.alt .ico{background:linear-gradient(135deg,#0ea5e9,#6366f1)}
.optbtn.alt2 .ico{background:linear-gradient(135deg,#f59e0b,#ef4444)}
.optbtn b{display:block;font:800 18px var(--display)}
.optbtn span{font-size:13px;color:var(--muted)}
.optbtn .chev{margin-left:auto;color:var(--dim);font-size:22px}
.optbtn.pulse .ico{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}50%{box-shadow:0 0 0 10px transparent}}

/* ---------- secret card ---------- */
.flip{perspective:1200px;margin:10px 0}
.card3d{-webkit-touch-callout:none;position:relative;width:100%;aspect-ratio:1/1.08;max-height:52vh;transform-style:preserve-3d;transition:transform .55s var(--spring);touch-action:none}
.card3d.revealed{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:30px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;border:1px solid #ffffff30;overflow:hidden}
.face.front{background:linear-gradient(150deg,color-mix(in srgb,var(--accent) 80%,#000),color-mix(in srgb,var(--accent2) 70%,#000));box-shadow:0 24px 60px #0008}
.face.front::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,#ffffff08 0 12px,transparent 12px 24px)}
.face.front .q{font:900 110px/1 var(--display);opacity:.95;text-shadow:0 10px 30px #0006;animation:qpulse 2s ease-in-out infinite}
@keyframes qpulse{50%{transform:scale(1.08)}}
.face.front .eye{font-weight:800;letter-spacing:.2em;font-size:12.5px;margin-top:14px;opacity:.9}
.face.back{transform:rotateY(180deg);background:linear-gradient(160deg,#1e1033,#0d0717);box-shadow:0 24px 60px #0008,inset 0 0 0 2px var(--accent)}
.face.back.bad{box-shadow:0 24px 60px #0008,inset 0 0 0 2px var(--red);background:radial-gradient(circle at 50% 0,#7f1d1d,#16070b 70%)}
.face.back .eye{font-weight:800;letter-spacing:.18em;font-size:12px;color:var(--muted)}
.face.back .word{font:900 clamp(34px,10vw,52px)/1.05 var(--display);margin:14px 0;letter-spacing:-.02em;word-break:break-word}
.face.back .role-ico{font-size:72px;line-height:1;margin-bottom:6px;filter:drop-shadow(0 8px 20px #0008)}
.face.back small{color:var(--muted);line-height:1.4}

/* ---------- timer ---------- */
.timer-wrap{position:relative;width:230px;height:230px;margin:10px auto}
.timer-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer-wrap circle{fill:none;stroke-width:12}
.timer-wrap .trk{stroke:#ffffff14}
.timer-wrap .bar{stroke:url(#tg);stroke-linecap:round;transition:stroke-dashoffset .3s linear}
.timer-txt{position:absolute;inset:0;display:grid;place-items:center;font:900 54px var(--display);font-variant-numeric:tabular-nums}
.timer-wrap.done .timer-txt{color:var(--red);animation:shake .5s ease-in-out 3}
.timer-wrap.low .timer-txt{color:var(--gold)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ---------- results ---------- */
.res{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-radius:16px;background:var(--glass);margin:7px 0;border:1px solid var(--line);animation:rise .5s var(--ease) both}
.res strong{font:800 17px var(--display)}
.res.bad{background:linear-gradient(110deg,#be123c66,#7e22ce44);border-color:#fb7185}
.res .who{display:flex;align-items:center;gap:10px;font-weight:700}
.res.dead{opacity:.5}
.res.dead .who{text-decoration:line-through}
.badge{font-size:11px;font-weight:800;letter-spacing:.1em;padding:5px 9px;border-radius:99px;background:#ffffff1c}
.code{font:900 52px/1 var(--display);letter-spacing:.14em;text-align:center;margin:8px 0}
.roster{display:grid;gap:7px}
.person{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--glass);border:1px solid var(--line);font-weight:700;animation:rise .4s var(--ease) both}

/* ---------- mafia ---------- */
.grid-players{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:10px 0}
.pcard{position:relative;padding:16px 12px;border-radius:18px;background:var(--glass);border:1px solid var(--line);text-align:center;font-weight:800;transition:all .25s var(--spring);min-height:86px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.pcard .av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:800 17px var(--display);background:linear-gradient(135deg,#ffffff30,#ffffff10)}
.pcard.sel{background:color-mix(in srgb,var(--accent) 35%,transparent);border-color:var(--accent);transform:scale(1.04);box-shadow:0 10px 26px color-mix(in srgb,var(--accent) 35%,transparent)}
.pcard.sel::after{content:"✓";position:absolute;top:8px;right:10px;font-size:14px}
.pcard:disabled{opacity:.3}
.moon{width:130px;height:130px;margin:6px auto 4px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffbe8,#e9e3c4 45%,#b8b08a);box-shadow:0 0 60px #fff6c955,0 0 140px #9fb4ff44;position:relative;animation:moonIn 1.2s var(--spring) both}
.moon::after{content:"";position:absolute;width:100%;height:100%;border-radius:50%;background:var(--bg);top:-14%;left:26%;opacity:.0}
.sun{width:130px;height:130px;margin:6px auto 4px;border-radius:50%;background:radial-gradient(circle,#fff3b0,#ffc65c 55%,#ff8a3d);box-shadow:0 0 80px #ffb84d99;animation:moonIn 1.2s var(--spring) both,sunspin 20s linear infinite}
@keyframes moonIn{from{transform:translateY(60px) scale(.5);opacity:0}to{transform:none;opacity:1}}
@keyframes sunspin{50%{box-shadow:0 0 120px #ffb84dcc}}
.narr{text-align:center;margin:8px 0}
.narr .say{font:900 clamp(28px,8vw,40px)/1.1 var(--display);letter-spacing:-.02em;animation:sayIn .7s var(--ease) both}
.narr .sub{color:var(--muted);margin-top:10px;line-height:1.45;animation:sayIn .7s .15s var(--ease) both}
@keyframes sayIn{from{opacity:0;transform:translateY(14px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.eyes{font-size:64px;text-align:center;margin:8px 0;animation:blink 3s ease-in-out infinite}
@keyframes blink{0%,45%,55%,100%{transform:scaleY(1)}50%{transform:scaleY(.1)}}
.stepdots{display:flex;justify-content:center;gap:6px;margin:12px 0}
.stepdots i{width:8px;height:8px;border-radius:50%;background:#ffffff26;transition:all .3s}
.stepdots i.on{background:var(--accent);width:22px;border-radius:5px}
.announce{text-align:center;padding:24px 16px;border-radius:26px;margin:12px 0;animation:pop .7s var(--spring) both}
.announce.killed{background:radial-gradient(circle at 50% 0,#991b1b,#2a0a12 75%);border:1px solid #f87171}
.announce.saved{background:radial-gradient(circle at 50% 0,#047857,#06241c 75%);border:1px solid #34d399}
.announce .big{font-size:64px;line-height:1}
.announce h3{font:900 30px/1.1 var(--display);margin:12px 0 6px}
.announce p{margin:0;color:#ffffffcc}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.winner{text-align:center;margin:10px 0}
.winner .big{font-size:90px;animation:pop .8s var(--spring) both}
.winner h2{font:900 40px/1 var(--display);margin:10px 0}
.alive-strip{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.alive-strip span{font-size:12.5px;font-weight:700;padding:6px 10px;border-radius:99px;background:var(--glass2)}
.alive-strip span.x{text-decoration:line-through;opacity:.4}
.inv{font:900 34px var(--display);text-align:center;padding:20px;border-radius:20px;margin:10px 0;animation:pop .6s var(--spring) both}
.inv.yes{background:#991b1b}.inv.no{background:#065f46}

/* ---------- confetti ---------- */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* ---------- toast & modal ---------- */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translate(-50%,40px);opacity:0;z-index:60;background:#1f1330f2;border:1px solid var(--line);padding:13px 18px;border-radius:16px;font-weight:700;font-size:14.5px;max-width:90vw;text-align:center;transition:all .35s var(--spring);box-shadow:0 14px 40px #000a;pointer-events:none}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast.err{border-color:#fb7185;color:#ffe4e6}
.modal-bg{position:fixed;inset:0;z-index:55;background:#0009;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:24px;animation:fadeIn .25s both}
.modal{width:min(100%,380px);background:#1a0f2b;border:1px solid var(--line);border-radius:24px;padding:22px;animation:pop .4s var(--spring) both}
.modal h3{margin:0 0 8px;font:800 22px var(--display)}
.modal p{color:var(--muted);margin:0 0 16px;line-height:1.45}

.howto ol{padding-left:20px;margin:6px 0;color:var(--muted);line-height:1.6}
.howto b{color:var(--ink)}
.rolelist{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.rolelist div{background:var(--glass);border-radius:14px;padding:12px;font-size:13px;color:var(--muted)}
.rolelist div b{display:block;font-size:15px;color:var(--ink);margin-bottom:3px}

@media (min-width:900px){.page{padding-top:40px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

.nojs{position:fixed;inset:0;z-index:90;background:#0b0614;color:#fbf6ff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;font-family:var(--font)}.nojs img{width:96px;height:96px;border-radius:24px;margin-bottom:14px}.nojs h2{font:900 34px var(--display);margin:0 0 12px}.nojs p{color:#bfb0d4;line-height:1.5;margin:0 0 12px}.nojs .ur{color:#8a7aa3}.nojs small{color:#8a7aa3;letter-spacing:.2em;font-weight:800;margin-top:12px}

function settings(back) {
  const sw = (id, on, b, s) => `<div class="toggle"><div><b>${b}</b><small>${s}</small></div><button class="sw ${on ? 'on' : ''}" id="${id}" role="switch" aria-checked="${on}" aria-label="${E(b)}"></button></div>`;
  page(`<h2 class="h2">${T('Settings', 'Settings')}</h2>
    <span class="label">${T('Language', 'Zubaan')}</span>
    <div class="seg"><button id="lEn" class="${APP.lang === 'en' ? 'sel' : ''}">English</button><button id="lUr" class="${APP.lang === 'ur' ? 'sel' : ''}">Roman Urdu</button></div>
    <span class="label">${T('Sound', 'Awaaz')}</span>
    <div class="panel" style="padding:6px 16px">
      ${sw('sMusic', APP.music, T('Background music', 'Background music'), T('Calm loop on menus, dark theme at night', 'Menu par halka music, raat mein dark theme'))}
      ${sw('sSfx', APP.sfx, T('Sound effects', 'Sound effects'), T('Taps, reveals, timer and more', 'Taps, reveal, timer waghera'))}
      ${sw('sVoice', APP.voice, T('Narrator voice', 'Narrator ki awaaz'), T('Mafia narrator speaks out loud', 'Mafia ka narrator bol kar batata hai'))}
    </div>
    <div class="grow"></div>
    <p class="hint">Kaun Imposter v${APP.version} · Created by Azfar</p>`, { title: T('SETTINGS', 'SETTINGS'), back: () => back() });
  $('lEn').onclick = () => { APP.lang = 'en'; store.set('lang', 'en'); settings(back); };
  $('lUr').onclick = () => { APP.lang = 'ur'; store.set('lang', 'ur'); settings(back); };
  const flip = (id, key, fn) => { $(id).onclick = () => { APP[key] = !APP[key]; store.set(key, APP[key]); $(id).classList.toggle('on', APP[key]); $(id).setAttribute('aria-checked', APP[key]); fn(APP[key]); }; };
  flip('sMusic', 'music', v => { Snd.setMusic(v); $$('[data-act="music"]').forEach(b => b.classList.toggle('off', !v)); });
  flip('sSfx', 'sfx', v => Snd.setSfx(v));
  flip('sVoice', 'voice', v => { Voice.on = v; if (v) Voice.say('Narrator voice is on.'); });
}

function howTo(back) {
  page(`<h2 class="h2">${T('How to play', 'Kaise khelein')}</h2>
    <div class="panel howto"><b style="font:800 20px var(--display)">Kaun Imposter?</b><ol>
      <li>${T('Add 3–10 players and pick a category.', '3–10 players add karein aur category chunein.')}</li>
      <li>${T('Pass the phone. Each player holds the card to see their secret word.', 'Phone pass karein. Har player card daba kar apna lafz dekhe.')}</li>
      <li>${T('Most players share one word. The imposter has a different word.', 'Zyada tar players ka lafz same hai. Imposter ka lafz alag hai.')}</li>
      <li>${T('Describe your word without saying it, then guess who the imposter is.', 'Lafz bole baghair uske baare mein baat karein, phir imposter dhoondein.')}</li></ol></div>
    <div class="panel howto"><b style="font:800 20px var(--display)">Mafia</b><ol>
      <li>${T('5–15 players. Pass the phone so everyone secretly sees their role.', '5–15 players. Phone pass karein taa ke har koi apna role chupke dekhe.')}</li>
      <li>${T('Put the phone in the middle. The app narrates the night.', 'Phone beech mein rakhein. App raat ki narration karegi.')}</li>

}

  function modePage() {
    page(`<h2 class="h2">${T('Game modes', 'Game modes')}</h2><p class="lead">${T('Choose one when you set up a round.', 'Round set karte waqt mode chunein.')}</p>
      ${modes().map(([m, n]) => `<div class="panel" style="margin:6px 0"><b style="font:800 19px var(--display)">${m}</b><p class="lead" style="margin:4px 0 0">${n}</p></div>`).join('')}
      <div class="grow"></div><button class="btn primary" id="mPlay">${T('PLAY', 'KHELO')}</button>`, { title: T('MODES', 'MODES'), back: () => hub('back') });
    $('mPlay').onclick = () => setup();
  }

  /* ---------- offline ---------- */
  function setup(dir) {
    stopAll(); setTheme(''); Snd.music('menu');
    const durs = [[60, '1m'], [120, '2m'], [180, '3m'], [300, '5m']];
    page(`<h2 class="h2">${T('Set up a round', 'Round tayyar karo')}</h2><p class="lead">${T('Pass one phone between 3 to 10 friends.', '3 se 10 doston ke darmiyan aik phone ghumao.')}</p>
      <span class="label">${T('Mode', 'Mode')}</span><div class="modes">${modes().map(([m, n]) => `<button class="mode ${S.mode === m ? 'sel' : ''}" data-mode="${m}" data-sfx="select"><b>${m}</b><span>${E(n)}</span></button>`).join('')}</div>
      <span class="label">${T('Category', 'Category')}</span><div class="chips">${categories().map(c => `<button class="chip ${S.category === c ? 'sel' : ''}" data-cat="${E(c)}" data-sfx="select">${E(c)}</button>`).join('')}</div>
      <span class="label">${T('Discussion time', 'Baat ka waqt')}</span><div class="chips">${durs.map(([v, l]) => `<button class="chip ${S.duration === v ? 'sel' : ''}" data-dur="${v}" data-sfx="select">${l}</button>`).join('')}</div>
      <div class="panel" style="padding:4px 16px;margin-top:16px"><div class="toggle"><div><b>${T('Imposter knows', 'Imposter ko pata ho')}</b><small>${T('The odd one out is told they are the imposter', 'Alag lafz wale ko bata diya jaye ke woh imposter hai')}</small></div><button class="sw ${S.knows ? 'on' : ''}" id="knows" role="switch"></button></div></div>
      <span class="label">${T('Players', 'Players')} · <span id="pc">${S.names.length}</span>/10</span>
      <div class="names" id="names">${S.names.map((n, i) => nameRow(n, i)).join('')}</div>
      <div class="row" style="margin-top:10px"><button class="btn small" id="rem">− ${T('REMOVE', 'HATAO')}</button><button class="btn small" id="add">+ ${T('ADD', 'BARHAO')}</button></div>
      <div class="grow"></div>
      <button class="btn primary" id="deal" data-sfx="deal">🃏 ${T('DEAL WORDS', 'LAFZ BAANTO')}</button>`, { title: 'OFFLINE', back: () => { save(); hub('back'); }, dir });

    $$('[data-cat]').forEach(x => x.onclick = () => { S.category = x.dataset.cat; $$('[data-cat]').forEach(y => y.classList.toggle('sel', y === x)); });
    $$('[data-dur]').forEach(x => x.onclick = () => { S.duration = +x.dataset.dur; $$('[data-dur]').forEach(y => y.classList.toggle('sel', y === x)); });
    $('knows').onclick = () => { S.knows = !S.knows; $('knows').classList.toggle('on', S.knows); };
    bindNames();
    $('add').onclick = () => { if (S.names.length >= 10) return; S.names.push(''); $('names').insertAdjacentHTML('beforeend', nameRow('', S.names.length - 1)); bindNames(); };
    $('rem').onclick = () => { if (S.names.length <= 3) return; S.names.pop(); $('names').lastElementChild.remove(); bindNames(); };

  }
  function nameRow(n, i) { return `<div class="name-row"><span class="num">${i + 1}</span><input class="field pname" data-i="${i}" maxlength="24" placeholder="${T('Player', 'Player')} ${i + 1}" value="${E(n)}"></div>`; }
  function bindNames() { $$('.pname').forEach(x => x.oninput = () => S.names[+x.dataset.i] = x.value); $('pc').textContent = S.names.length; $('add').disabled = S.names.length >= 10; $('rem').disabled = S.names.length <= 3; }

  function makeAssignments(count, mode, category) {
    const words = shuffle([...new Set(pool(category))]);
    if (words.length < count) throw Error(T('Not enough words in this category', 'Is category mein lafz kam hain'));
    const order = shuffle([...Array(count).keys()]), out = Array(count).fill(words[0]);
    order.forEach((idx, i) => { if (mode === 'Chaos') out[idx] = words[i]; else if (i < (mode === 'Double Trouble' ? 2 : 1)) out[idx] = words[1]; });
    return { out, main: words[0], other: words[1] };
  }
  function deal() {
    const names = S.names.map((n, i) => n.trim() || `Player ${i + 1}`);
    if (S.mode === 'Double Trouble' && names.length < 5) return toast(T('Double Trouble needs at least 5 players.', 'Double Trouble mein kam az kam 5 players chahiye.'), true);
    try { const a = makeAssignments(names.length, S.mode, S.category); S.assignments = a.out; S.mainWord = a.main; } catch (e) { return toast(e.message, true); }
    S.names = names; save(); S.turn = 0; S.seen = false;
    Snd.music('play'); passScreen();
  }
  function wordBack(word, imp) {
    return `<div class="eye">${imp ? T('YOU ARE THE IMPOSTER', 'AAP IMPOSTER HAIN') : T('YOUR WORD', 'AAP KA LAFZ')}</div><div class="word">${E(word)}</div>${imp ? `<small>${T('Blend in. Don’t get caught!', 'Ghul mil jao. Pakre mat jana!')}</small>` : `<small>${T('Describe it without saying it.', 'Bataye baghair is ke baare mein baat karo.')}</small>`}`;
  }
  function passScreen() {
    S.page = 'pass';
    const n = S.names[S.turn], word = S.assignments[S.turn], imp = S.knows && S.mode !== 'Chaos' && word !== S.mainWord, last = S.turn === S.names.length - 1;
    page(`<div class="center"><span class="badge">${S.turn + 1} / ${S.names.length}</span><h2 class="h2" style="margin-top:12px">${E(n)}</h2><p class="lead">${T('Make sure only you can see the screen.', 'Screen sirf aap dekhein.')}</p></div>
      ${cardHTML(T('HOLD TO REVEAL', 'DEKHNE KE LIYE DABAO'))}
      <p class="hint">${T('Release to hide. Then pass the phone.', 'Chhorne par chhup jayega. Phir phone aage do.')}</p>
      <div class="grow"></div>
      <button class="btn primary" id="next">${last ? '💬 ' + T('START DISCUSSION', 'BAAT SHURU KARO') : T('NEXT PLAYER', 'AGLA PLAYER') + ' →'}</button>`,
      { title: T('SECRET WORD', 'CHHUPA LAFZ'), back: async () => { if (await ask(T('Leave this round?', 'Round chhorein?'), T('Words will be dealt again.', 'Lafz dobara baante jayenge.'))) setup('back'); } });
    bindHoldCard(wordBack(word, imp), imp, () => S.seen = true);
    $('next').onclick = () => {
      if (!S.seen) return toast(T('Hold the card to see your word first.', 'Pehle card daba kar lafz dekhein.'), true);

  function discussion(online) {
    S.page = online ? 'onDisc' : 'offDisc';
    const dur = S.mode === 'Blitz' ? 60 : (online ? (S.room?.duration || 180) : S.duration);
    const canReveal = !online || S.host;
    page(`<div class="center"><h2 class="h2">${T('Find the imposter', 'Imposter dhoondo')}</h2><p class="lead">${T('Talk about your words without saying them.', 'Apne lafz ke baare mein baat karo, lafz mat bolo.')}</p></div>
      ${ringHTML()}
      ${online ? '' : `<div class="center"><button class="btn small ghost" id="pause" style="width:auto;display:inline-flex;padding:0 22px">⏸ ${T('Pause', 'Rokein')}</button></div>`}
      <div class="grow"></div>
      ${canReveal ? `<button class="btn primary" id="reveal" data-sfx="heartbeat">🔍 ${T('REVEAL WORDS', 'LAFZ REVEAL KARO')}</button>` : `<p class="hint">${T('The host will reveal the words.', 'Host lafz reveal karega.')}</p>`}`,
      { title: T('DISCUSSION', 'BAAT CHEET'), back: online ? leaveAsk : async () => { if (await ask(T('Leave round?', 'Round chhorein?'), '')) setup('back'); } });
    Clock.run(S.start, dur, () => toast(T('Time is up! Reveal the words.', 'Waqt khatam! Lafz reveal karein.')));
    if ($('pause')) $('pause').onclick = () => { const p = Clock.pause(); $('pause').innerHTML = p ? '▶ ' + T('Resume', 'Chalao') : '⏸ ' + T('Pause', 'Rokein'); };
    if ($('reveal')) $('reveal').onclick = () => {
      if (online) updateRoom({ status: 'result' }).then(fetchRoom).then(onlineResult).catch(err);
      else results(S.names.map((n, i) => [i, n]), Object.fromEntries(S.assignments.map((w, i) => [i, w])), S.mainWord, false);
    };

  }

  function results(players, asg, main, online) {
    Clock.stop(); S.page = online ? 'onRes' : 'offRes';
    const chaos = S.mode === 'Chaos', odd = players.filter(([id]) => asg[id] !== main);
    page(`<div class="center"><h2 class="h2">${chaos ? T('Total chaos!', 'Mukammal chaos!') : odd.length > 1 ? T('The imposters were…', 'Imposters the…') : T('The imposter was…', 'Imposter tha…')}</h2></div>
      <div id="suspense" class="center" style="padding:30px 0"><div class="eyes">👀</div></div>
      <div id="resList" style="display:none">
        ${chaos ? '' : `<div class="announce killed"><div class="big">🎭</div><h3>${odd.map(([, n]) => E(n)).join(' & ')}</h3><p>${T('Their word', 'Un ka lafz')}: <b>${E(asg[odd[0]?.[0]] || '')}</b> · ${T('Everyone else', 'Baaqi sab')}: <b>${E(main)}</b></p></div>`}
        ${players.map(([id, n], i) => `<div class="res ${!chaos && asg[id] !== main ? 'bad' : ''}" style="animation-delay:${.1 + i * .07}s"><span class="who"><span class="num">${initials(n)}</span>${E(n)}</span><strong>${E(asg[id])}</strong></div>`).join('')}
      </div>
      <div class="grow"></div>
      <div id="resBtns" style="display:none">${online ? (S.host ? `<button class="btn primary" id="again">🔁 ${T('NEW ROUND', 'NAYA ROUND')}</button>` : `<p class="hint">${T('Waiting for host to start a new round.', 'Host ke naye round ka intezar.')}</p>`) : `<button class="btn primary" id="again">🔁 ${T('NEW ROUND', 'NAYA ROUND')}</button>`}
      <button class="btn" id="exit">${online ? T('LEAVE ROOM', 'ROOM CHHORO') : T('HOME', 'HOME')}</button></div>`,
      { title: T('REVEAL', 'REVEAL'), back: online ? leaveAsk : () => hub('back') });
    setTimeout(() => {
      if (!$('suspense')) return;
      $('suspense').remove(); $('resList').style.display = ''; $('resBtns').style.display = '';

    }, 1600);
    if ($('again')) $('again').onclick = online ? () => updateRoom({ status: 'lobby', assignments: null }).then(fetchRoom).then(lobby).catch(err) : () => setup();
    $('exit').onclick = online ? leave : () => hub('back');
    if (online && !S.host) watch();
  }

  /* ---------- online (Firebase REST) ---------- */
  let pollT = null, polling = false;
  function stopAll() { clearInterval(pollT); pollT = null; Clock.stop(); }
  const err = e => toast(String(e?.message || e).replace(/^Server \d+: /, ''), true);
  async function auth() {
    if (S.auth && S.auth.expires > Date.now() + 30000) return S.auth;
    const old = store.get('auth', null);
    if (old && old.expires > Date.now() + 30000) return (S.auth = old);
    let data;
    if (old?.refresh) { try { const r = await fetch(`https://securetoken.googleapis.com/v1/token?key=${API_KEY}`, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams({ grant_type: 'refresh_token', refresh_token: old.refresh }) }); if (r.ok) { const j = await r.json(); data = { uid: j.user_id, token: j.id_token, refresh: j.refresh_token, expires: Date.now() + Number(j.expires_in) * 1000 }; } } catch (e) {} }
    if (!data) {
      const r = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${API_KEY}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ returnSecureToken: true }) });
      if (!r.ok) throw Error(T('Could not connect. Check internet and try again.', 'Connection nahin hua. Internet check karke dobara koshish karein.'));
      const j = await r.json(); data = { uid: j.localId, token: j.idToken, refresh: j.refreshToken, expires: Date.now() + Number(j.expiresIn) * 1000 };
    }
    S.auth = data; store.set('auth', data); return data;
  }
  async function db(method, path, body) {
    const a = await auth();
    const r = await fetch(`${DB}/rooms/${S.code}${path}.json?auth=${encodeURIComponent(a.token)}`, { method, headers: { 'Content-Type': 'application/json' }, body: body === undefined ? undefined : JSON.stringify(body) });
    if (!r.ok) { const j = await r.json().catch(() => ({})); throw Error(j.error || `Server ${r.status}`); }
    return r.json();
  }
  const fetchRoom = () => db('GET', ''), updateRoom = p => db('PATCH', '', p);

  function onlineEntry(dir) {
    stopAll(); setTheme(''); Snd.music('menu');
    page(`<h2 class="h2">${T('Play online', 'Online khelo')}</h2><p class="lead">${T('Each friend joins on their own phone with a six-digit room code.', 'Har dost apne phone par 6 digit room code se join kare.')}</p>
      <div class="panel"><label class="label" for="myname" style="margin-top:0">${T('Your name', 'Aap ka naam')}</label><input id="myname" class="field" maxlength="24" autocomplete="nickname" placeholder="${T('Your name', 'Aap ka naam')}" value="${E(store.get('name', ''))}">
      <button class="btn primary" id="create" style="margin-top:14px">➕ ${T('CREATE ROOM', 'ROOM BANAO')}</button></div>
      <div class="panel"><label class="label" for="roomcode" style="margin-top:0">${T('Or join a room', 'Ya room join karo')}</label><input id="roomcode" class="field" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="123456" style="font:800 24px var(--display);letter-spacing:.3em;text-align:center">
      <button class="btn" id="join" style="margin-top:12px">${T('JOIN ROOM', 'ROOM JOIN KARO')} →</button></div>`,
      { title: 'ONLINE', back: () => hub('back'), dir });
    $('create').onclick = () => enter(true); $('join').onclick = () => enter(false);
  }
  function busy(v) { $$('.page:not(.exit) button').forEach(b => { if (!b.dataset.act) b.disabled = v; }); }
  async function enter(create) {
    const name = $('myname').value.trim(), code = $('roomcode').value.trim();
    if (!name) return toast(T('Enter your name first.', 'Pehle apna naam likhein.'), true);
    if (!create && !/^\d{6}$/.test(code)) return toast(T('Enter a six-digit room code.', '6 digit room code likhein.'), true);
    store.set('name', name); busy(true);
    try {
      const a = await auth(); S.host = create;
      S.code = create ? String(100000 + crypto.getRandomValues(new Uint32Array(1))[0] % 900000) : code;
      if (create) {
        const ex = await fetchRoom(); if (ex?.hostUid) throw Error('Code collision. Try again.');
        await db('PUT', '', { hostUid: a.uid, status: 'lobby', mode: 'Classic', category: 'All', duration: 180, players: { [a.uid]: { name } } });
      } else {
        const room = await fetchRoom();
        if (!room?.hostUid) throw Error(T('Room not found.', 'Room nahin mila.'));
        if (room.status !== 'lobby') throw Error(T('This round already started.', 'Round shuru ho chuka hai.'));
        if (Object.keys(room.players || {}).length >= 10) throw Error(T('Room is full.', 'Room bhar gaya hai.'));
        await db('PUT', `/players/${a.uid}`, { name });
      }
      store.set('room', { code: S.code, host: S.host }); S.seen = false;
      Snd.play('select'); lobby(await fetchRoom());
    } catch (e) { busy(false); err(e); }
  }
  let lastLobby = '';
  function lobby(room) {
    stopAll();
    if (!room?.hostUid) { toast(T('Room closed.', 'Room band ho gaya.'), true); return onlineEntry('back'); }
    S.room = room; S.mode = room.mode || 'Classic'; S.page = 'lobby'; Snd.music('menu');
    lastLobby = JSON.stringify([room.mode, room.category, room.players]);
    const people = Object.entries(room.players || {});
    page(`<div class="panel hot center"><span class="label" style="margin:0;color:#fff">ROOM CODE</span><div class="code">${S.code}</div><p class="hint" style="color:#fffc;margin:4px 0 10px">${people.length} / 10 ${T('players', 'players')}</p><button class="btn small" id="copy" style="width:auto;display:inline-flex;padding:0 20px;margin:0 auto">📋 ${T('COPY CODE', 'CODE COPY KARO')}</button></div>
      <p class="lead center">${S.host ? T('Share this code with friends.', 'Yeh code doston ko bhejein.') : T('Waiting for the host to start…', 'Host ke shuru karne ka intezar…')}</p>
      <span class="label">${T('Players', 'Players')}</span><div class="roster">${people.map(([id, p], i) => `<div class="person" style="animation-delay:${i * .05}s"><span class="num">${initials(p.name)}</span>${E(p.name)}${id === room.hostUid ? ' 👑' : ''}</div>`).join('')}</div>
      ${S.host ? `<span class="label">${T('Mode', 'Mode')}</span><div class="chips">${modes().map(([m]) => `<button class="chip ${room.mode === m ? 'sel' : ''}" data-mode="${m}" data-sfx="select">${m}</button>`).join('')}</div>
      <span class="label">${T('Category', 'Category')}</span><div class="chips">${categories().map(c => `<button class="chip ${room.category === c ? 'sel' : ''}" data-cat="${E(c)}" data-sfx="select">${E(c)}</button>`).join('')}</div>` : ''}
      <div class="grow"></div>
      ${S.host ? `<button class="btn primary" id="start" data-sfx="deal">🚀 ${T('START GAME', 'GAME SHURU KARO')}</button>` : ''}
      <button class="btn ghost" id="leave" data-sfx="back">${T('LEAVE ROOM', 'ROOM CHHORO')}</button>`,
      { title: 'LOBBY', back: leaveAsk, dir: 'fade' });
    $('copy').onclick = async () => { try { await navigator.clipboard.writeText(S.code); toast(T('Code copied', 'Code copy ho gaya')); } catch (e) { toast(S.code); } };
    $('leave').onclick = leave;
    if (S.host) {
      $$('[data-mode]').forEach(x => x.onclick = () => updateRoom({ mode: x.dataset.mode }).then(fetchRoom).then(lobby).catch(err));
      $$('[data-cat]').forEach(x => x.onclick = () => updateRoom({ category: x.dataset.cat }).then(fetchRoom).then(lobby).catch(err));
      $('start').onclick = startOnline;
    }
    watch();
  }
  function watch() {
    clearInterval(pollT);
    pollT = setInterval(async () => {
      if (polling || !S.code) return; polling = true;
      try {
        const room = await fetchRoom();
        if (!room?.hostUid) { stopAll(); S.code = ''; store.del('room'); toast(T('Room closed.', 'Room band ho gaya.'), true); onlineEntry('back'); return; }
        if (S.page === 'lobby') { if (room.status !== 'lobby') route(room); else if (JSON.stringify([room.mode, room.category, room.players]) !== lastLobby) lobby(room); }
        else if (S.page === 'onWord' && room.status !== 'words') route(room);
        else if (S.page === 'onDisc' && room.status === 'result') route(room);
        else if (S.page === 'onRes' && room.status === 'lobby') route(room);
      } catch (e) { toast(T('Connection lost. Retrying…', 'Connection gaya. Dobara koshish…'), true); }
      finally { polling = false; }
    }, 1600);
  }
  function route(room) {
    S.room = room; S.mode = room.mode || 'Classic';
    if (room.status === 'lobby') lobby(room);
    else if (room.status === 'words') onlineWord(room);
    else if (room.status === 'discussion') { S.start = Number(room.startedAt) || Date.now(); discussion(true); }
    else if (room.status === 'result') onlineResult(room);
  }
  async function startOnline() {
    try {
      busy(true);
      const room = await fetchRoom(), ids = Object.keys(room.players || {});
      if (ids.length < 3) throw Error(T('At least 3 players needed.', 'Kam az kam 3 players chahiye.'));
      if (room.mode === 'Double Trouble' && ids.length < 5) throw Error(T('Double Trouble needs 5 players.', 'Double Trouble mein 5 players chahiye.'));
      const a = makeAssignments(ids.length, room.mode, room.category || 'All'), assignments = {};
      ids.forEach((id, i) => assignments[id] = a.out[i]);
      await updateRoom({ status: 'words', assignments, mainWord: a.main, otherWord: a.other });
      Object.assign(room, { status: 'words', assignments, mainWord: a.main, otherWord: a.other });
      S.seen = false; onlineWord(room);
    } catch (e) { busy(false); err(e); }
  }
  function onlineWord(room) {
    stopAll(); S.room = room; S.page = 'onWord'; Snd.music('play');
    const word = room.assignments?.[S.auth.uid]; if (!word) return lobby(room);
    const imp = room.mode !== 'Chaos' && word !== room.mainWord;
    page(`<div class="center"><h2 class="h2">${T('Your secret word', 'Aap ka chhupa lafz')}</h2><p class="lead">${T('Hold the card. Keep it private.', 'Card dabao. Lafz chhupa kar rakho.')}</p></div>
      ${cardHTML(T('HOLD TO REVEAL', 'DEKHNE KE LIYE DABAO'))}<div class="grow"></div>
      ${S.host ? `<button class="btn primary" id="discuss">💬 ${T('START DISCUSSION', 'BAAT SHURU KARO')}</button>` : `<p class="hint">${T('Waiting for host to start discussion…', 'Host ka intezar hai…')}</p>`}`,
      { title: T('SECRET WORD', 'CHHUPA LAFZ'), back: leaveAsk });
    bindHoldCard(wordBack(word, imp), imp, () => S.seen = true);
    if ($('discuss')) $('discuss').onclick = async () => {
      if (!S.seen) return toast(T('See your word first.', 'Pehle lafz dekhein.'), true);
      try { const t = Date.now(); await updateRoom({ status: 'discussion', startedAt: t }); S.start = t; discussion(true); } catch (e) { err(e); }
    };
    watch();
  }
  function onlineResult(room) { S.room = room; S.mode = room.mode || 'Classic'; results(Object.entries(room.players || {}).map(([id, p]) => [id, p.name]), room.assignments || {}, room.mainWord, true); }
  async function leaveAsk() { if (await ask(T('Leave room?', 'Room chhorein?'), S.host ? T('As host, leaving closes the room for everyone.', 'Host ke jaane se room sab ke liye band ho jayega.') : '')) leave(); }
  async function leave() {
    stopAll();
    if (S.code && S.auth) { try { if (S.host) await db('DELETE', ''); else await db('DELETE', `/players/${S.auth.uid}`); } catch (e) {} }
    store.del('room'); S.code = ''; S.room = null; S.host = false; hub('back');
  }
  async function restore() {
    const saved = store.get('room', null); if (!saved?.code) return false;
    try {
      const a = await auth(); S.code = saved.code; S.host = !!saved.host;
      const room = await fetchRoom();
      if (!room?.players?.[a.uid] || (S.host && room.hostUid !== a.uid)) throw Error('ended');
      route(room); return true;
    } catch (e) { store.del('room'); S.code = ''; return false; }
  }
  return { hub, setup, restore };
})();

/* Mafia — one-phone party game. The app (or a human) narrates the night. */
const Mafia = (() => {
  const ROLES = {
    mafia: { ico: '🔪', en: 'Mafia', ur: 'Mafia', d: ['Each night, secretly pick someone to eliminate with your team. Act innocent in the day.', 'Har raat apni team ke saath chupke se kisi ko khatam karo. Din mein masoom bano.'] },
    doctor: { ico: '💉', en: 'Doctor', ur: 'Doctor', d: ['Each night, choose one player to save. You can save yourself.', 'Har raat aik player ko bachao. Khud ko bhi bacha sakte ho.'] },
    detective: { ico: '🕵️', en: 'Detective', ur: 'Detective', d: ['Each night, check one player to learn if they are Mafia.', 'Har raat aik player check karo ke woh Mafia hai ya nahin.'] },
    civilian: { ico: '🧑', en: 'Civilian', ur: 'Civilian', d: ['Find the Mafia in the day and vote them out.', 'Din mein Mafia dhoondo aur vote se nikaalo.'] }
  };
  const rn = r => T(ROLES[r].en, ROLES[r].ur);
  const M = {
    names: store.get('maf_names', ['', '', '', '', '']), mafia: store.get('maf_count', 0), doctor: store.get('maf_doc', true), detective: store.get('maf_det', true),
    revealDead: store.get('maf_reveal', false), dayTime: store.get('maf_day', 120), human: store.get('maf_human', false),
    players: [], turn: 0, seen: false, night: 0, steps: [], si: 0, kill: null, save: null, sel: null, autoT: null
  };
  const save = () => { store.set('maf_names', M.names); store.set('maf_count', M.mafia); store.set('maf_doc', M.doctor); store.set('maf_det', M.detective); store.set('maf_reveal', M.revealDead); store.set('maf_day', M.dayTime); store.set('maf_human', M.human); };
  const autoMafia = n => n <= 6 ? 1 : n <= 9 ? 2 : 3;
  const maxMafia = n => Math.max(1, Math.floor((n - 1) / 2));
  const alive = () => M.players.filter(p => p.alive);
  const holders = r => M.players.filter(p => p.role === r);
  const say = (en) => { if (!M.human) Voice.say(en); };
  const clearAuto = () => { clearTimeout(M.autoT); M.autoT = null; };
  const quit = async () => { if (await ask(T('Quit this game?', 'Game chhorein?'), T('Progress will be lost.', 'Game ka progress khatam ho jayega.'))) { clearAuto(); Voice.stop(); hub('back'); } };

  function hub(dir) {
    clearAuto(); Clock.stop(); Voice.stop(); setTheme('theme-mafia'); Snd.music('menu');
    page(`<div class="hub-hero"><div style="width:120px;height:120px;border-radius:30px;overflow:hidden;box-shadow:0 20px 60px #0009,0 0 0 1px #ffffff2a;animation:float 4.5s ease-in-out infinite">${MAFIA_ART}</div><h1 class="h1">MAFIA</h1><p class="lead" style="margin-top:10px">${T('Close your eyes. Someone is lying.', 'Aankhein band karo. Koi jhoot bol raha hai.')}</p></div>
      <button class="optbtn pulse" id="mNew"><span class="ico">🎬</span><div><b>${T('New Game', 'Naya Game')}</b><span>${T('5–15 players on one phone', '5–15 players, aik phone')}</span></div><span class="chev">›</span></button>
      <button class="optbtn alt" id="mRoles"><span class="ico">🎭</span><div><b>${T('Roles & Rules', 'Roles aur Rules')}</b><span>Mafia · Doctor · Detective · Civilian</span></div><span class="chev">›</span></button>`,
      { title: 'MAFIA', back: () => menu('back'), dir });
    $('mNew').onclick = () => setup();
    $('mRoles').onclick = rules;
  }

  function rules() {
    page(`<h2 class="h2">${T('Roles', 'Roles')}</h2>
      ${Object.keys(ROLES).map(r => `<div class="panel" style="display:flex;gap:14px;align-items:center;margin:6px 0"><span style="font-size:40px">${ROLES[r].ico}</span><div><b style="font:800 19px var(--display)">${rn(r)}</b><p class="lead" style="margin:3px 0 0;font-size:14px">${T(...ROLES[r].d)}</p></div></div>`).join('')}
      <h2 class="h2" style="margin-top:18px">${T('A round', 'Aik round')}</h2>
      <div class="panel howto"><ol>
        <li><b>${T('Night', 'Raat')}:</b> ${T('everyone closes their eyes. Mafia wakes and picks a target, then the Doctor and the Detective.', 'sab aankhein band karte hain. Mafia jaag kar target chunta hai, phir Doctor aur Detective.')}</li>
        <li><b>${T('Morning', 'Subah')}:</b> ${T('the narrator says who died, or that the Doctor saved them.', 'narrator batata hai kaun mara, ya Doctor ne bacha liya.')}</li>
        <li><b>${T('Day', 'Din')}:</b> ${T('discuss, accuse, and vote one player out.', 'baat karo, ilzaam lagao, aur aik player ko vote se nikaalo.')}</li>
        <li><b>${T('Win', 'Jeet')}:</b> ${T('Civilians win when all Mafia are gone. Mafia wins when they equal the others.', 'Saare Mafia khatam to Civilians jeet gaye. Mafia baaqi logon ke barabar ho gaye to Mafia jeet gaya.')}</li></ol></div>`,
      { title: T('RULES', 'RULES'), back: () => hub('back') });
  }

  function setup(dir) {
    clearAuto(); Clock.stop(); setTheme('theme-mafia'); Snd.music('menu');
    const n = M.names.length; if (!M.mafia || M.mafia > maxMafia(n)) M.mafia = autoMafia(n);
    const days = [[60, '1m'], [120, '2m'], [180, '3m'], [300, '5m']];
    const sw = (id, on, b, s) => `<div class="toggle"><div><b>${b}</b><small>${s}</small></div><button class="sw ${on ? 'on' : ''}" id="${id}" role="switch"></button></div>`;
    page(`<h2 class="h2">${T('New Mafia game', 'Naya Mafia game')}</h2>
      <span class="label">${T('Narrator', 'Narrator')}</span>
      <div class="seg"><button id="nApp" class="${!M.human ? 'sel' : ''}">🔊 ${T('App narrates', 'App narrator')}</button><button id="nHum" class="${M.human ? 'sel' : ''}">🎙️ ${T('Human narrator', 'Insaan narrator')}</button></div>
      <p class="hint" id="nHint">${M.human ? T('One friend holds the phone and reads the script. They do not play.', 'Aik dost phone pakar kar script parhega. Woh khud nahin khelega.') : T('Put the phone in the middle. The app speaks the night out loud.', 'Phone beech mein rakhein. App raat ki baatein bol kar batayegi.')}</p>
      <span class="label">${T('Roles', 'Roles')}</span>
      <div class="stepper"><div><b>🔪 Mafia</b><small>${T('Recommended', 'Mashwara')}: <span id="rec">${autoMafia(n)}</span></small></div><div class="ctl"><button class="ibtn" id="mMinus">−</button><span id="mCnt">${M.mafia}</span><button class="ibtn" id="mPlus">+</button></div></div>
      <div class="panel" style="padding:4px 16px;margin-top:8px">
        ${sw('tDoc', M.doctor, '💉 Doctor', T('Saves one player each night', 'Har raat aik player ko bachata hai'))}
        ${sw('tDet', M.detective, '🕵️ Detective', T('Checks one player each night', 'Har raat aik player check karta hai'))}
        ${sw('tRev', M.revealDead, T('Reveal role on death', 'Marne par role dikhao'), T('Show the role of eliminated players', 'Nikle hue player ka role dikhao'))}
      </div>
      <span class="label">${T('Day discussion', 'Din ki baat cheet')}</span><div class="chips">${days.map(([v, l]) => `<button class="chip ${M.dayTime === v ? 'sel' : ''}" data-day="${v}" data-sfx="select">${l}</button>`).join('')}</div>
      <span class="label">${T('Players', 'Players')} · <span id="pc">${n}</span>/15</span>
      <div class="names" id="names">${M.names.map((x, i) => row(x, i)).join('')}</div>
      <div class="row" style="margin-top:10px"><button class="btn small" id="rem">− ${T('REMOVE', 'HATAO')}</button><button class="btn small" id="add">+ ${T('ADD', 'BARHAO')}</button></div>
      <div class="panel" id="sum" style="text-align:center;font-size:14px;color:var(--muted)"></div>
      <div class="grow"></div>
      <button class="btn primary" id="go" data-sfx="deal">🎭 ${T('DEAL ROLES', 'ROLES BAANTO')}</button>`,
      { title: 'MAFIA', back: () => { save(); hub('back'); }, dir });
    const summary = () => {
      const c = M.names.length, civ = c - M.mafia - (M.doctor ? 1 : 0) - (M.detective ? 1 : 0);
      $('sum').innerHTML = `🔪 ${M.mafia} Mafia${M.doctor ? ' · 💉 1 Doctor' : ''}${M.detective ? ' · 🕵️ 1 Detective' : ''} · 🧑 ${civ} Civilian${civ === 1 ? '' : 's'}`;
      $('mCnt').textContent = M.mafia; $('rec').textContent = autoMafia(c); $('pc').textContent = c;
      $('mMinus').disabled = M.mafia <= 1; $('mPlus').disabled = M.mafia >= maxMafia(c);
      $('add').disabled = c >= 15; $('rem').disabled = c <= 5;
      $$('.mname').forEach(x => x.oninput = () => M.names[+x.dataset.i] = x.value);
    };
    $('nApp').onclick = () => { M.human = false; $('nApp').classList.add('sel'); $('nHum').classList.remove('sel'); $('nHint').textContent = T('Put the phone in the middle. The app speaks the night out loud.', 'Phone beech mein rakhein. App raat ki baatein bol kar batayegi.'); };
    $('nHum').onclick = () => { M.human = true; $('nHum').classList.add('sel'); $('nApp').classList.remove('sel'); $('nHint').textContent = T('One friend holds the phone and reads the script. They do not play.', 'Aik dost phone pakar kar script parhega. Woh khud nahin khelega.'); };
    $('mMinus').onclick = () => { M.mafia = Math.max(1, M.mafia - 1); summary(); };
    $('mPlus').onclick = () => { M.mafia = Math.min(maxMafia(M.names.length), M.mafia + 1); summary(); };
    const tg = (id, k) => $(id).onclick = () => { M[k] = !M[k]; $(id).classList.toggle('on', M[k]); summary(); };
    tg('tDoc', 'doctor'); tg('tDet', 'detective'); tg('tRev', 'revealDead');
    $$('[data-day]').forEach(x => x.onclick = () => { M.dayTime = +x.dataset.day; $$('[data-day]').forEach(y => y.classList.toggle('sel', y === x)); });
    $('add').onclick = () => { if (M.names.length >= 15) return; M.names.push(''); $('names').insertAdjacentHTML('beforeend', row('', M.names.length - 1)); summary(); };
    $('rem').onclick = () => { if (M.names.length <= 5) return; M.names.pop(); $('names').lastElementChild.remove(); if (M.mafia > maxMafia(M.names.length)) M.mafia = maxMafia(M.names.length); summary(); };
    $('go').onclick = deal;
    summary();
  }
  function row(n, i) { return `<div class="name-row"><span class="num">${i + 1}</span><input class="field mname" data-i="${i}" maxlength="20" placeholder="${T('Player', 'Player')} ${i + 1}" value="${E(n)}"></div>`; }

  function deal() {
    const names = M.names.map((n, i) => n.trim() || `Player ${i + 1}`);
    if (new Set(names.map(n => n.toLowerCase())).size !== names.length) return toast(T('Every player needs a different name.', 'Har player ka naam alag hona chahiye.'), true);
    const civ = names.length - M.mafia - (M.doctor ? 1 : 0) - (M.detective ? 1 : 0);
    if (civ < 1) return toast(T('Add more players or fewer roles.', 'Players barhao ya roles kam karo.'), true);
    const roles = shuffle([...Array(M.mafia).fill('mafia'), ...(M.doctor ? ['doctor'] : []), ...(M.detective ? ['detective'] : []), ...Array(civ).fill('civilian')]);
    M.names = names; save();
    M.players = names.map((name, i) => ({ name, role: roles[i], alive: true }));
    M.turn = 0; M.seen = false; M.night = 0;
    Snd.music('play'); rolePass();
  }

  function rolePass() {
    const p = M.players[M.turn], last = M.turn === M.players.length - 1, R = ROLES[p.role];
    const team = p.role === 'mafia' ? holders('mafia').filter(x => x !== p).map(x => x.name) : [];
    page(`<div class="center"><span class="badge">${M.turn + 1} / ${M.players.length}</span><h2 class="h2" style="margin-top:12px">${E(p.name)}</h2><p class="lead">${T('Take the phone. Only you should look.', 'Phone lo. Sirf aap dekhein.')}</p></div>
      ${cardHTML(T('HOLD TO SEE YOUR ROLE', 'ROLE DEKHNE KE LIYE DABAO'))}
      <p class="hint">${T('Release to hide. Then pass the phone.', 'Chhorne par chhup jayega. Phir phone aage do.')}</p><div class="grow"></div>
      <button class="btn primary" id="next">${last ? '🌙 ' + T('ALL DONE', 'SAB NE DEKH LIYA') : T('NEXT PLAYER', 'AGLA PLAYER') + ' →'}</button>`,
      { title: T('YOUR ROLE', 'AAP KA ROLE'), back: quit });
    bindHoldCard(`<div class="role-ico">${R.ico}</div><div class="eye">${T('YOU ARE', 'AAP HAIN')}</div><div class="word">${rn(p.role)}</div><small>${T(...R.d)}${team.length ? `<br><br><b style="color:#fca5a5">${T('Your team', 'Aap ki team')}: ${team.map(E).join(', ')}</b>` : ''}</small>`, p.role === 'mafia', () => M.seen = true);
    $('next').onclick = () => {
      if (!M.seen) return toast(T('Hold the card to see your role first.', 'Pehle card daba kar role dekhein.'), true);
      M.turn++; M.seen = false;
      if (M.turn < M.players.length) rolePass(); else ready();
    };
  }

  function ready() {
    page(`<div class="grow"></div><div class="center"><div style="font-size:70px">📱</div><h2 class="h2">${M.human ? T('Narrator, take the phone', 'Narrator, phone lo') : T('Place the phone in the middle', 'Phone beech mein rakh do')}</h2>
      <p class="lead">${M.human ? T('Read each line out loud and tap the players the role-holders point to.', 'Har line bol kar parho aur jis player ki taraf ishara ho, us par tap karo.') : T('Turn the volume up. The narrator will guide you through the night.', 'Awaaz tez karein. Narrator raat mein aap ko guide karega.')}</p></div><div class="grow"></div>
      <button class="btn primary" id="begin">🌙 ${T('BEGIN NIGHT 1', 'PEHLI RAAT SHURU')}</button>`, { title: 'MAFIA', back: quit, dir: 'fade' });
    $('begin').onclick = () => night();
  }

  /* ---------- night ---------- */
  function night() {
    M.night++; M.kill = null; M.save = null;
    setTheme('theme-mafia night'); Snd.music('night'); Snd.play('gong');
    const S = [{ en: 'Night falls. Everyone, close your eyes.', ur: 'Raat ho gayi. Sab apni aankhein band karein.', type: 'wait' },
      { en: 'Mafia, open your eyes. Choose who to eliminate.', ur: 'Mafia, aankhein kholo. Chuno kis ko khatam karna hai.', type: 'pick', role: 'mafia' },
      { en: 'Mafia, close your eyes.', ur: 'Mafia, aankhein band karo.', type: 'wait' }];
    if (M.doctor) S.push({ en: 'Doctor, open your eyes. Choose who to save.', ur: 'Doctor, aankhein kholo. Chuno kis ko bachana hai.', type: 'pick', role: 'doctor' }, { en: 'Doctor, close your eyes.', ur: 'Doctor, aankhein band karo.', type: 'wait' });
    if (M.detective) S.push({ en: 'Detective, open your eyes. Choose someone to investigate.', ur: 'Detective, aankhein kholo. Kisi aik ko check karo.', type: 'pick', role: 'detective' }, { en: 'Detective, close your eyes.', ur: 'Detective, aankhein band karo.', type: 'wait' });
    M.steps = S; M.si = 0; nightStep();
  }
  const dots = () => `<div class="stepdots">${M.steps.map((_, i) => `<i class="${i === M.si ? 'on' : ''}"></i>`).join('')}</div>`;
  const nextStep = () => { clearAuto(); M.si++; if (M.si < M.steps.length) nightStep(); else morning(); };

  function nightStep() {
    clearAuto();
    const st = M.steps[M.si], line = APP.lang === 'ur' ? st.ur : st.en;
    if (st.type === 'wait') {
      page(`<div class="center"><span class="badge">${T('NIGHT', 'RAAT')} ${M.night}</span></div>${dots()}
        <div class="moon"></div><div class="eyes">${/close|band/i.test(st.en) ? '😌' : '👁️'}</div>
        <div class="narr"><div class="say">${E(line)}</div>${M.human ? `<div class="sub">🎙️ ${T('Read this out loud', 'Yeh bol kar parho')}</div>` : ''}</div>
        <div class="grow"></div><button class="btn ${M.human ? 'primary' : 'ghost'}" id="nx">${T('Next', 'Aage')} →</button>`,
        { title: T('NARRATOR', 'NARRATOR'), back: quit, dir: 'fade' });
      say(st.en);
      $('nx').onclick = nextStep;
      if (!M.human) M.autoT = setTimeout(nextStep, 5200);
      return;
    }
    // pick step
    const holdersAlive = holders(st.role).filter(p => p.alive);
    const deadRole = holdersAlive.length === 0;
    const opts = alive().filter(p => st.role === 'mafia' ? p.role !== 'mafia' : st.role === 'detective' ? p.role !== 'detective' : true);
    M.sel = null;
    const who = M.human ? `<div class="sub">${rn(st.role)}: <b>${holders(st.role).map(p => E(p.name) + (p.alive ? '' : ' ✝')).join(', ')}</b></div>` : '';
    page(`<div class="center"><span class="badge">${T('NIGHT', 'RAAT')} ${M.night}</span></div>${dots()}
      <div class="narr"><div style="font-size:52px;margin:6px 0">${ROLES[st.role].ico}</div><div class="say">${E(line)}</div>${who}</div>
      ${deadRole ? `<div class="center" style="padding:30px 0"><div class="eyes">⏳</div><p class="hint">${T('…', '…')}</p></div>`
        : `<div class="grid-players">${opts.map(p => `<button class="pcard" data-p="${M.players.indexOf(p)}" data-sfx="select"><span class="av">${initials(p.name)}</span>${E(p.name)}</button>`).join('')}</div>`}
      <div id="inv"></div><div class="grow"></div>
      ${deadRole ? (M.human ? `<button class="btn primary" id="cf">${T('Next', 'Aage')} →</button>` : '') : `<button class="btn primary" id="cf" disabled>${T('CONFIRM', 'PAKKA KARO')}</button>`}`,
      { title: T('NARRATOR', 'NARRATOR'), back: quit, dir: 'fade' });
    say(st.en);
    if (deadRole) {
      // role-holder is out: keep up the act so nobody learns it
      if (M.human) $('cf').onclick = nextStep; else M.autoT = setTimeout(nextStep, 6000 + Math.random() * 3000);
      return;
    }
    $$('.pcard').forEach(b => b.onclick = () => { M.sel = +b.dataset.p; $$('.pcard').forEach(x => x.classList.toggle('sel', x === b)); $('cf').disabled = false; });
    $('cf').onclick = () => {
      if (M.sel === null) return;
      if (st.role === 'mafia') { M.kill = M.sel; nextStep(); }
      else if (st.role === 'doctor') { M.save = M.sel; nextStep(); }
      else if (st.role === 'detective') {
        const isM = M.players[M.sel].role === 'mafia';
        $$('.pcard').forEach(x => x.disabled = true);
        $('inv').innerHTML = `<div class="inv ${isM ? 'yes' : 'no'}">${E(M.players[M.sel].name)}: ${isM ? '👎 ' + T('MAFIA', 'MAFIA HAI') : '👍 ' + T('NOT MAFIA', 'MAFIA NAHIN')}</div>`;
        Snd.play(isM ? 'error' : 'save'); vibrate(isM ? [80, 60, 80] : 40);
        $('cf').textContent = T('GOT IT', 'SAMAJH GAYA'); $('cf').onclick = nextStep;
      }
    };
  }

  /* ---------- morning ---------- */
  function morning() {
    setTheme('theme-mafia'); Snd.music('menu');
    const died = M.kill !== null && M.kill !== M.save ? M.players[M.kill] : null;
    const saved = M.kill !== null && M.kill === M.save;
    if (died) died.alive = false;
    page(`<div class="center"><span class="badge">${T('MORNING', 'SUBAH')} ${M.night}</span></div><div class="sun"></div>
      <div class="narr"><div class="say">${T('Everyone, open your eyes.', 'Sab aankhein kholo.')}</div></div>
      <div id="ann"></div>
      <div class="alive-strip">${M.players.map(p => `<span class="${p.alive ? '' : 'x'}">${E(p.name)}</span>`).join('')}</div>
      <div class="grow"></div><div id="mb"></div>`, { title: T('NARRATOR', 'NARRATOR'), back: quit, dir: 'fade' });
    Snd.play('morning'); say('Everyone, open your eyes.');
    setTimeout(() => {
      if (!$('ann')) return;
      if (died) {
        $('ann').innerHTML = `<div class="announce killed"><div class="big">⚰️</div><h3>${E(died.name)}</h3><p>${T('was killed by the Mafia last night.', 'ko raat Mafia ne maar diya.')}${M.revealDead ? `<br>${T('They were', 'Woh the')}: <b>${ROLES[died.role].ico} ${rn(died.role)}</b>` : ''}</p></div>`;
        Snd.play('kill'); vibrate([100, 50, 200]); say(`Last night, ${died.name} was killed by the Mafia.`);
      } else {
        $('ann').innerHTML = `<div class="announce saved"><div class="big">🛡️</div><h3>${saved ? T('Saved by the Doctor!', 'Doctor ne bacha liya!') : T('Nobody died', 'Koi nahin mara')}</h3><p>${T('Everyone survived the night.', 'Sab raat se bach gaye.')}</p></div>`;
        Snd.play('save'); say(saved ? 'The doctor saved someone last night. Nobody died.' : 'Nobody died last night.');
      }
      $('mb').innerHTML = `<button class="btn primary" id="toDay">☀️ ${T('START DISCUSSION', 'BAAT SHURU KARO')}</button>`;
      if (!winCheck()) $('toDay').onclick = day;
    }, 2400);
  }

  function winCheck() {
    const m = alive().filter(p => p.role === 'mafia').length, o = alive().length - m;
    if (m === 0) { setTimeout(() => end('town'), 2200); if ($('toDay')) $('toDay').style.display = 'none'; return true; }
    if (m >= o) { setTimeout(() => end('mafia'), 2200); if ($('toDay')) $('toDay').style.display = 'none'; return true; }
    return false;
  }

  /* ---------- day ---------- */
  function day() {
    page(`<div class="center"><span class="badge">${T('DAY', 'DIN')} ${M.night}</span><h2 class="h2" style="margin-top:12px">${T('Who is the Mafia?', 'Mafia kaun hai?')}</h2><p class="lead">${T('Discuss, accuse, defend.', 'Baat karo, ilzaam lagao, apna difa karo.')}</p></div>
      ${ringHTML()}
      <div class="center"><button class="btn small ghost" id="pause" style="width:auto;display:inline-flex;padding:0 22px">⏸ ${T('Pause', 'Rokein')}</button></div>
      <div class="alive-strip">${alive().map(p => `<span>${E(p.name)}</span>`).join('')}</div>
      <div class="grow"></div><button class="btn primary" id="toVote" data-sfx="heartbeat">🗳️ ${T('GO TO VOTE', 'VOTE KARO')}</button>`,
      { title: T('DAY', 'DIN'), back: quit });
    say('Discuss among yourselves. Who is the Mafia?');
    Clock.run(Date.now(), M.dayTime, () => say('Time is up. It is time to vote.'));
    $('pause').onclick = () => { const p = Clock.pause(); $('pause').innerHTML = p ? '▶ ' + T('Resume', 'Chalao') : '⏸ ' + T('Pause', 'Rokein'); };
    $('toVote').onclick = vote;
  }

  function vote() {
    Clock.stop(); M.sel = null;
    page(`<div class="center"><h2 class="h2">${T('Vote someone out', 'Kisi ko vote se nikaalo')}</h2><p class="lead">${T('Count hands, then pick the player with the most votes.', 'Haath ginein, phir sab se zyada votes wala player chunein.')}</p></div>
      <div class="grid-players">${alive().map(p => `<button class="pcard" data-p="${M.players.indexOf(p)}" data-sfx="select"><span class="av">${initials(p.name)}</span>${E(p.name)}</button>`).join('')}</div>
      <button class="btn small ghost" id="skip">🤝 ${T('No one (tie / skip)', 'Koi nahin (barabar / skip)')}</button>
      <div class="grow"></div><button class="btn danger" id="cf" disabled>⚖️ ${T('ELIMINATE', 'NIKAALO')}</button>`,
      { title: T('VOTE', 'VOTE'), back: quit });
    say('Time to vote.');
    $$('.pcard').forEach(b => b.onclick = () => { M.sel = +b.dataset.p; $$('.pcard').forEach(x => x.classList.toggle('sel', x === b)); $('cf').disabled = false; });
    $('skip').onclick = () => verdict(null);
    $('cf').onclick = () => M.sel !== null && verdict(M.players[M.sel]);
  }

  function verdict(p) {
    if (p) p.alive = false;
    page(`<div class="grow"></div>
      ${p ? `<div class="announce killed"><div class="big">⚖️</div><h3>${E(p.name)}</h3><p>${T('has been voted out.', 'ko vote se nikaal diya gaya.')}${M.revealDead ? `<br>${T('They were', 'Woh the')}: <b>${ROLES[p.role].ico} ${rn(p.role)}</b>` : ''}</p></div>`
        : `<div class="announce saved"><div class="big">🤝</div><h3>${T('No one was eliminated', 'Koi nahin nikla')}</h3><p>${T('The town could not agree.', 'Sheher wale faisla nahin kar sake.')}</p></div>`}
      <div class="alive-strip">${M.players.map(x => `<span class="${x.alive ? '' : 'x'}">${E(x.name)}</span>`).join('')}</div>
      <div class="grow"></div><button class="btn primary" id="nn">🌙 ${T('NIGHT', 'RAAT')} ${M.night + 1}</button>`,
      { title: T('VERDICT', 'FAISLA'), back: quit, dir: 'fade' });
    Snd.play('vote'); vibrate(120);
    say(p ? `${p.name} has been voted out.` : 'No one was eliminated today.');
    if (!winCheck()) $('nn').onclick = night; else $('nn').style.display = 'none';
  }

  function end(w) {
    clearAuto(); setTheme(w === 'mafia' ? 'theme-mafia' : ''); Snd.music('menu');
    const town = w === 'town';
    page(`<div class="winner"><div class="big">${town ? '🏆' : '🔪'}</div><h2>${town ? T('Civilians win!', 'Civilians jeet gaye!') : T('Mafia wins!', 'Mafia jeet gaya!')}</h2><p class="lead">${town ? T('Every member of the Mafia was found.', 'Saare Mafia pakre gaye.') : T('The Mafia took over the town.', 'Mafia ne sheher par qabza kar liya.')}</p></div>
      <span class="label">${T('All roles', 'Sab ke roles')}</span>
      ${M.players.map((p, i) => `<div class="res ${p.role === 'mafia' ? 'bad' : ''} ${p.alive ? '' : 'dead'}" style="animation-delay:${.2 + i * .06}s"><span class="who"><span class="num">${initials(p.name)}</span>${E(p.name)}</span><strong>${ROLES[p.role].ico} ${rn(p.role)}</strong></div>`).join('')}
      <div class="grow"></div><button class="btn primary" id="again">🔁 ${T('PLAY AGAIN', 'DOBARA KHELO')}</button><button class="btn" id="home">${T('MAFIA MENU', 'MAFIA MENU')}</button>`,
      { title: T('GAME OVER', 'GAME KHATAM'), back: () => hub('back'), dir: 'fade' });
    Snd.play(town ? 'win' : 'lose'); confetti(town ? 120 : 50);
    say(town ? 'The civilians win! All the Mafia have been caught.' : 'The Mafia wins! They have taken over the town.');
    $('again').onclick = () => setup(); $('home').onclick = () => hub('back');
  }

  return { hub };
})();

/* Boot: apply settings, splash → menu */
(function () {
  Snd.setMusic(APP.music); Snd.setSfx(APP.sfx); Voice.on = APP.voice;
  if (!window.__SINGLE && /^https?:/.test(location.protocol) && 'serviceWorker' in navigator && !window.AndroidTTS && !window.isDesktopApp)
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  splash(async () => {
    menu('fade');
    if (store.get('room', null)) { const ok = await Imposter.restore(); if (ok) toast(T('Rejoined your room', 'Aap ka room dobara join ho gaya')); }
  });
})();

</script></body></html>
